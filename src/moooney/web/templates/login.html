<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar · moooney</title>
  <script>
    (function () {
      var p = 'auto'; try { p = localStorage.getItem('moooney-theme') || 'auto'; } catch (e) {}
      document.documentElement.dataset.theme = (p === 'dark' || (p === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/static/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="/static/app.css?v=60">
</head>
<body>
<main class="login">
  <h1>moooney</h1>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    {% if error %}<p class="login-error" role="alert">Usuario o contraseña incorrectos.</p>{% endif %}
    <label for="user">Usuario</label>
    <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
