<tr class="{{ 'saved' if saved else '' }}">
  <td style="white-space:nowrap">{{ r.category }}</td>
  <td><div class="bar {{ 'crit' if r.pct >= 100 else 'warn' if r.pct >= 80 else '' }}"><span style="width:{{ [r.pct, 100]|min }}%"></span><i class="today" style="left:{{ today_pct|default(100) }}%"></i></div>
    <span class="concept">{{ '%.0f'|format(r.pct) }} %</span></td>
  <td class="num">{{ r.spent|eur }}</td>
  <td class="num {{ 'neg' if r.remaining < 0 else '' }}">{{ r.remaining|eur }}</td>
  <td class="num {{ 'neg' if r.projected and r.projected > r.limit else 'muted' }}">{{ r.projected|eur if r.projected is not none else '—' }}</td>
  <td class="num">
    {# Se guarda al salir del campo o con Enter; sin botón. #}
    <form class="inline-form" hx-post="/budgets/{{ r.category|urlencode }}" hx-trigger="change" hx-target="closest tr" hx-swap="outerHTML">
      <input type="hidden" name="month" value="{{ month }}">
      <input type="number" name="amount" value="{{ '%.0f'|format(r.limit) }}" min="0" step="5" style="width:84px;text-align:right" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">
      {% if saved %}<span class="concept" style="color:var(--dominant);font-weight:800">✓</span>{% endif %}
    </form>
  </td>
</tr>
