# Levanta moooney con un solo comando:   docker compose up -d
# Luego abre http://127.0.0.1:8765
#
# - ./data    tus Excel (data/excel), la base SQLite y la demo. Nunca entra en la imagen.
# - ./config  taxonomía, reglas, modelos, enriquecimiento y tus presupuestos.
# - .env      opcional: LITELLM_API_KEY (o pégala en Ajustes: queda en data/.env), MOOONEY_OFFLINE=1.
#
# El puerto se publica SOLO en 127.0.0.1: nadie más en tu red puede abrir la web.

services:
  web:
    build: .
    image: moooney:local
    container_name: moooney-web
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./reports:/app/reports
    restart: unless-stopped

  # Opcional: vigila data/excel y corre la pipeline sola cuando dejas un Excel nuevo.
  #   docker compose --profile watch up -d
  watch:
    profiles: ["watch"]
    image: moooney:local
    container_name: moooney-watch
    command: ["uv", "run", "--no-sync", "moooney", "watch", "--interval", "120"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./reports:/app/reports
    restart: unless-stopped
    depends_on:
      - web
