# Reglas deterministas aplicadas sobre la clave de comercio (clean_concept).
# Lista ordenada: la primera que casa (re.search, mayusculas sin acentos) gana.
# category/subcategory/flow_type deben existir en config/categories.yaml.

rules:
  # --- estructura bancaria conocida ---
  - {pattern: '^NOMINA', category: Ingresos, subcategory: nomina, flow_type: income}
  - pattern: '^DEVOLUCION NOMINA'
    category: Ingresos
    subcategory: nomina
    flow_type: income # queda como ingreso negativo en metricas
  - pattern: '^LIQUIDACION DE TARJETAS DE CREDITO'
    category: Tarjeta de credito
    subcategory: liquidacion
    flow_type: card_settlement
  - pattern: '^TRASPASO'
    category: Transferencias
    subcategory: traspaso interno
    flow_type: transfer_internal
  - pattern: '^BIZUM ENVIADO'
    category: Transferencias
    subcategory: bizum enviado
    flow_type: expense # un bizum a una persona suele ser consumo
  - pattern: '^BIZUM RECIBIDO'
    category: Transferencias
    subcategory: bizum recibido
    flow_type: income
  - pattern: '^TRANSFERENCIA (A|DE) PARTICULAR AEAT'
    category: Impuestos y tasas
    subcategory: hacienda
    flow_type: income # devolucion de Hacienda
  - pattern: '^TRANSFERENCIA A PARTICULAR'
    category: Transferencias
    subcategory: a particular
    flow_type: transfer_internal
  - pattern: '^TRANSFERENCIA DE PARTICULAR'
    category: Transferencias
    subcategory: desde particular
    flow_type: transfer_internal
  - {pattern: '^RETIRADA DE EFECTIVO', category: Efectivo, subcategory: retiradas, flow_type: expense}
  - {pattern: '^INGRESO EN CAJERO', category: Efectivo, subcategory: ingresos, flow_type: income}
  - {pattern: '^LIQUIDACION REMESAS', category: Efectivo, subcategory: ingresos, flow_type: income}
  - pattern: '^PAYPAL EUROPE'
    category: Otros
    subcategory: otros
    flow_type: expense # recibo de PayPal sin nombre de comercio: no hay forma determinista de saber el gasto
  - pattern: '^PAYPAL ADD TO BAL'
    category: Transferencias
    subcategory: a particular
    flow_type: transfer_internal # saldo en la cartera, la compra ya se ve aparte

  # --- inversion en el propio banco ---
  - pattern: '^DIVIDENDO|^REEMBOLSO|^CUPON|DIVIDENDO|REEMBOLSO DE FONDO'
    category: Ahorro e inversion
    subcategory: rendimientos de inversion
    flow_type: income
  - pattern: 'PLAN DE PENSIONES|APORTACION|\bPP\b'
    category: Ahorro e inversion
    subcategory: planes de pensiones
    flow_type: investment
  - pattern: '^SUSCRIPCION(?!.*(NETFLIX|SPOTIFY|PRIME|HBO|DISNEY|YOUTUBE|OPENAI|ANTHROPIC|CLAUDE))'
    category: Ahorro e inversion
    subcategory: fondos
    flow_type: investment
  - pattern: 'COMPRA DE? VALORES|VENTA DE? VALORES|CARTERA DE? VALORES|FONDO DE INVERSION|^FONDO '
    category: Ahorro e inversion
    subcategory: valores
    flow_type: investment

  # --- comida a domicilio (antes de restaurantes genericos) ---
  - {pattern: 'WETACA|GLOVO|UBER EATS|JUST ?EAT|DELIVEROO|GOIKO', category: Alimentacion, subcategory: restaurantes, flow_type: expense}

  # --- peajes y telepeaje (Vía-T del Santander) ---
  - pattern: 'VIA.?T\b|PEAJE|AUTOPISTA|AUDASA|BIP.?DRIVE|IDENTRACK|APLA? Telpeaje'
    category: Transporte
    subcategory: peajes
    flow_type: expense
  - pattern: 'PARKING|PARKIN|APARCAMIENTO'
    category: Transporte
    subcategory: parking
    flow_type: expense

  # --- combustibles ---
  - pattern: '^US |^US$|^E ?S [A-Z]|^ES$|PLENERGY|PLENOIL|PETROPRIX|BALLENOIL|ARAL STATION|REPSOL|CEPSA|GALP|\bBP\b|SHELL|CAMPSA|GASOLIN|COMBUSTIBLE|POSTO DE? COMBUSTIVE'
    category: Transporte
    subcategory: combustible
    flow_type: expense

  # --- transporte publico ---
  - pattern: 'AEROPORTOS?|AEROPUERTO|AENA\b|RENFE|ALSA|MONBUS|AVANZA|METRO\b|\bTREN\b|AEROLINEA|RYANAIR|VOLING|VUELING|IBERIA|AIR EUROPA|TAXI|CABIFY|UBER|ALSA|BUSES'
    category: Transporte
    subcategory: transporte publico
    flow_type: expense

  # --- alimentacion ---
  - pattern: 'SUPERMERCADOS|FROIZ|GADIS|^GA\b|ENRIQUE TOMAS|VINOS\b|EROSKI|CARREFOUR MARKET|CARREFOUR|\bDIA\b|LIDL|ALDI|ALCAMPO|MERCADONA|COSTCO|PANADERIA|PANADERIA|PASTELERIA|BOLLERIA|HELADERIA|FRUTERIA|VERDULERIA|CHARCUTERIA|POLLERIA'
    category: Alimentacion
    subcategory: supermercado
    flow_type: expense
  - pattern: 'BAR |^BAR$|BAR$|CAFETERIA|RESTAURANTE|CANTINA|PIZZERIA|XANTAR|TASCA|TASQUITA|TAPAS|TAPERIA|HAMBUR|BAKERY|FIVE GUYS|CHIRINGUITO|BODEGUILLA|ARTESA\b|ULTRAMARINO|PESCADITO? FRITO|BODEGA|TABERNA|CERVECERIA|VENDING|HORCHATERIA|SIDERIA|MARISQUERIA|ASADOR|MCDONALD|TELEPIZZA|KEBAB|BURGUER|BURGER|PIZZA|TAPERIA|COMEDOR|^CAF '
    category: Alimentacion
    subcategory: restaurantes
    flow_type: expense

  # --- salud ---
  - pattern: 'FARMACIA|PARAFARMACIA|OPTICA|OPTICA|DENTAL|ODONTO|CLINICA|CENTRO MEDICO|HOSPITAL|ANALISIS CLINICOS|FISIO'
    category: Salud
    subcategory: farmacia
    flow_type: expense

  # --- seguros (marcas antes que el generico) ---
  - {pattern: 'SANITAS', category: Seguros, subcategory: salud, flow_type: expense}
  - pattern: 'SEGURO|AXA\b|REALE\b|MAPFRE|LINEA DIRECTA|GENERALI|ZURICH| MUTUA|MUTUACTIVOS|CASER|SANTA LUCIA|VERTI|HELVETIA'
    category: Seguros
    subcategory: otros
    flow_type: expense

  # --- suministros y telefonia ---
  - pattern: 'IBERDROLA|NATURGY|ENDESA|\bEDP\b|VIESGO|FENIE|SOLAR(?:R)?\b|BUTANO'
    category: Vivienda
    subcategory: suministros
    flow_type: expense
  - pattern: 'AUGAS|AGUA\b'
    category: Vivienda
    subcategory: suministros
    flow_type: expense
  - pattern: 'MOVISTAR|VODAFONE|ORANGE|MASMOVIL|YOIGO|RCABLE|R CABLE|FIBRA|ADSL|\bDIGI\b'
    category: Vivienda
    subcategory: telefonia e internet
    flow_type: expense

  # --- hipoteca, prestamo, alquiler ---
  - {pattern: 'HIPOTECA|PRESTAMO|LEASING?', category: Vivienda, subcategory: hipoteca y prestamo, flow_type: expense}
  - {pattern: 'ALQUILER|ARRENDA', category: Vivienda, subcategory: alquiler, flow_type: expense}

  # --- suscripciones digitales (marcas: streaming primero) ---
  - pattern: 'NETFLIX|SPOTIFY|PRIMEVIDEO|PRIME VIDEO|AMAZON PRIME|\bHBO\b|DISNEY|YOUTUBE|APPLE ?MUSIC|DAZN|MOVISTARD\+|F1 TV'
    category: Suscripciones
    subcategory: streaming
    flow_type: expense
  - pattern: 'GOOGLE|APPLE|ICLOUD|ITUNES|MICROSOFT|OPENAI|CHATGPT|ANTHROPIC|CLAUDE|ADOBE|DROPBOX|PROTON|AD FREE|ONE DRIVE|LICENCIA|SOFTWARE|HOSTINGER|NAMECHEAP'
    category: Suscripciones
    subcategory: software y cloud
    flow_type: expense

  # --- impuestos y tasas ---
  - pattern: '^IMPUESTO|AEAT|HACIENDA|TRIBUTARIO'
    category: Impuestos y tasas
    subcategory: hacienda
    flow_type: expense
  - pattern: '\bIBI\b|AYUNTAMIENTO|CONCELLO|BASURA|SUMA\b'
    category: Impuestos y tasas
    subcategory: tasas locales
    flow_type: expense
  - pattern: '\bDGT\b|MULTA|SANCION|VISADO'
    category: Impuestos y tasas
    subcategory: trafico
    flow_type: expense

  # --- comisiones del banco ---
  - pattern: '^TARIFA|^COMISION|COMISION DE|MANTENIMIENTO|PROGRAMA SAN|CUOTA DE'
    category: Comisiones bancarias
    subcategory: comisiones
    flow_type: expense

  # --- compras ---
  - pattern: 'AMAZON\b|WWW AMAZON|AMZN|ALIEXPRESS|ALIEXPRESS|SHEIN|\bTEMU\b|EBAY|PCCOMPONENTS|PC COMPONENTS|FNAC|CORTE INGLES|MEDIAMARKT|LEROY MERLIN|AKI\b|B&Q|OBRAMAT'
    category: Compras
    subcategory: online
    flow_type: expense

  # --- ropa y hogar ---
  - pattern: 'TK MAX|PRIMARK|ZARA|INDITEX|STRADIVARIUS|MANGO\b|DESCENTURA?|DECATHLON|LEFTIES?|PULL ?(&|AND) ?BEAR|OYSHO|BERSHKA|ZALA ?NDO|SPRINTER|CORTEFIEL|INTIMISSIMI|PUNTO BLANCO|MODAS\b'
    category: Compras
    subcategory: ropa y calzado
    flow_type: expense
  - pattern: 'FERRETERIA|BRICOLAGE|BRICOMART|GAMA? HOGAR|BAZAR|OBRAMAT'
    category: Compras
    subcategory: hogar y bricolaje
    flow_type: expense

  # --- ocio ---
  # pagos con Alipay/WeChat: gasto del viaje a China (decision del usuario, 2026-10-11)
  - {pattern: '^ALIPAY|^WEIXIN', category: Ocio, subcategory: viajes, flow_type: expense}
  - pattern: 'HOTEL|HOSTAL|ALBERGUE|PENSION\b|CASA RURAL|AIRBNB|BOOKING|PARADOR|RESERVA ?ONLINE|AGENCIA DE VIAJES'
    category: Ocio
    subcategory: viajes
    flow_type: expense
  - pattern: 'GYM|FITNESS|XIMNASIO|PILATES|PADEL|FUTBOL|CLUB DEPORTIVO|NATACION'
    category: Ocio
    subcategory: deporte
    flow_type: expense
  - pattern: '\bCINES?\b|OCINE|MULTICINES|CINESA|ENTRADAS\b|KIOSKO|QUIOSCO|LIBRERIA|LIBRO|TEATRO|AUDITORIO|CONCIERTO|MUSEO|ENTRADAS?\.COM|TICKETmaster'
    category: Ocio
    subcategory: cultura
    flow_type: expense

  # --- educacion ---
  - pattern: 'UNIVERSIDAD|ESCOLA|ACADEMIA|MATRICULA|CURSO\b|FORMACION|IDIOMAS|COPISTERIA'
    category: Educacion
    subcategory: formacion
    flow_type: expense
