# Taxonomia cerrada de moooney.
# La descripcion de cada categoria se envia literalmente a Clef-Flash como criteria
# de la pregunta "category": escribir frases discriminantes, no sinonimos.

categories:
  Ingresos:
    flow_type: income
    description: "Dinero que entra: nomina, prestaciones, devoluciones de Hacienda o reembolsos de compras"
    subcategories: [nomina, prestaciones, otros ingresos]
  Vivienda:
    flow_type: expense
    description: "Gastos de vivir en tu casa: hipoteca, alquiler, luz, agua, gas, comunidad, telefono e internet"
    subcategories: [hipoteca y prestamo, alquiler, suministros, telefonia e internet, comunidad]
  Alimentacion:
    flow_type: expense
    description: "Comida: compra de supermercado o comida y bebida fuera de casa (bares, restaurantes, cafeterias)"
    subcategories: [supermercado, restaurantes]
  Transporte:
    flow_type: expense
    description: "Moverse: combustible, peajes y telepeaje, parking, tren, autobus, avion, taxi"
    subcategories: [combustible, peajes, parking, transporte publico]
  Salud:
    flow_type: expense
    description: "Gastos medicos no cubiertos por el seguro: farmacia, consultas, dentist, optica"
    subcategories: [farmacia, medicina]
  Ocio:
    flow_type: expense
    description: "Disfrute: viajes y hoteles, deporte, conciertos, cultura, regalos"
    subcategories: [viajes, deporte, cultura]
  Suscripciones:
    flow_type: expense
    description: "Cuotas periodicas de servicios digitales: streaming, musica, software, nube, IA"
    subcategories: [streaming, software y cloud, otras]
  Compras:
    flow_type: expense
    description: "Compra de productos no perecederos: ropa, tecnologia, hogar, bricolaje, compras online"
    subcategories: [online, ropa y calzado, hogar y bricolaje, tecnologia]
  Educacion:
    flow_type: expense
    description: "Formacion: cursos, matrículas, libros, material escolar"
    subcategories: [formacion, material]
  Seguros:
    flow_type: expense
    description: "Primas de seguros: salud, hogar, coche, vida"
    subcategories: [salud, hogar, coche, vida]
  Impuestos y tasas:
    flow_type: expense
    description: "Hacienda, ayuntamiento, IBI, tasas de trafico y tributos locales"
    subcategories: [hacienda, tasas locales, trafico]
  Transferencias:
    flow_type: transfer_internal
    description: "Dinero que solo se mueve: traspasos entre cuentas y huchas propias, bizum y transferencias a otras personas"
    subcategories: [traspaso interno, bizum enviado, bizum recibido, a particular, desde particular]
  Ahorro e inversion:
    flow_type: investment
    description: "Aportar dinero a ahorro o inversion: fondos, planes de pensiones, acciones; tambien sus rendimientos"
    subcategories: [fondos, planes de pensiones, valores, rendimientos de inversion]
  Tarjeta de credito:
    flow_type: card_settlement
    description: "Pago mensual que liquida las compras hechas con la tarjeta de credito"
    subcategories: [liquidacion]
  Comisiones bancarias:
    flow_type: expense
    description: "Lo que cobra el banco por si mismo: comisiones, mantenimiento, tarjetas de servicios, tarifas"
    subcategories: [comisiones, mantenimiento]
  Efectivo:
    flow_type: expense
    description: "Retiradas e ingresos de dinero en cajeros automaticos"
    subcategories: [retiradas, ingresos]
  Otros:
    flow_type: expense
    description: "Cualquier movimiento que no encaje claramente en ninguna otra categoria"
    subcategories: [otros]

# Opciones de flow_type con su descripcion para Clef
flow_types:
  expense: "Gasto: dinero que se gasta en consumir"
  income: "Ingreso: dinero que entra como ganancia o devolucion"
  transfer_internal: "Traspaso entre cuentas o huchas propias: no es ni gasto ni ingreso"
  investment: "Aportacion a inversion (fondo, plan, acciones): es ahorro, no gasto"
  card_settlement: "Liquidacion de la tarjeta de credito: las compras ya se contaron por su cuenta"
